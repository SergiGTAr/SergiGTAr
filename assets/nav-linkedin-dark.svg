<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120" role="img" aria-labelledby="title-universal-nav-linkedin-dark desc-universal-nav-linkedin-dark">
  <title id="title-universal-nav-linkedin-dark">LINKEDIN</title><desc id="desc-universal-nav-linkedin-dark">Responsive navigation control for LINKEDIN.</desc>
  
    <defs>
      <linearGradient id="bg-universal-nav-linkedin-dark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#010503"/>
        <stop offset="0.55" stop-color="#03150A"/>
        <stop offset="1" stop-color="#010503"/>
      </linearGradient>
      <radialGradient id="radar-universal-nav-linkedin-dark" cx="50%" cy="50%" r="58%">
        <stop offset="0" stop-color="#00FF66" stop-opacity=".16"/>
        <stop offset=".55" stop-color="#00FF66" stop-opacity=".04"/>
        <stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="sweep-universal-nav-linkedin-dark" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#00FF66" stop-opacity="0"/>
        <stop offset=".5" stop-color="#00FF66" stop-opacity=".25"/>
        <stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
      </linearGradient>
      <pattern id="grid-universal-nav-linkedin-dark" width="30" height="30" patternUnits="userSpaceOnUse">
        <path d="M30 0H0V30" fill="none" stroke="#0B3F23" stroke-width="1" opacity=".55"/>
      </pattern>
      <pattern id="scan-universal-nav-linkedin-dark" width="4" height="4" patternUnits="userSpaceOnUse">
        <path d="M0 3.5H4" stroke="#000000" stroke-width="1" opacity=".20"/>
      </pattern>
      <filter id="glow-universal-nav-linkedin-dark" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft-universal-nav-linkedin-dark" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.4"/>
      </filter>
    </defs>
    <style>
      .mono { font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 3px; }
      .micro { font-size: 12px; font-weight: 700; letter-spacing: 1.8px; }
      .body { font-size: 17px; letter-spacing: .5px; }
      .scan-sweep { animation: scan-universal-nav-linkedin-dark 8s linear infinite; }
      .pulse { animation: pulse-universal-nav-linkedin-dark 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink-universal-nav-linkedin-dark 1.05s steps(1) infinite; }
      .flow { stroke-dasharray: 12 8; animation: flow-universal-nav-linkedin-dark 2.8s linear infinite; }
      .radar-sweep { animation: rotate-universal-nav-linkedin-dark 5.5s linear infinite; transform-box: fill-box; transform-origin: center; }
      .glitch { animation: glitch-universal-nav-linkedin-dark 7s steps(1) infinite; }
      .boot-1 { animation: boot-universal-nav-linkedin-dark .4s .10s both; }
      .boot-2 { animation: boot-universal-nav-linkedin-dark .4s .35s both; }
      .boot-3 { animation: boot-universal-nav-linkedin-dark .4s .60s both; }
      .boot-4 { animation: boot-universal-nav-linkedin-dark .4s .85s both; }
      @keyframes scan-universal-nav-linkedin-dark { from { transform: translateY(-90px); } to { transform: translateY(690px); } }
      @keyframes pulse-universal-nav-linkedin-dark { 0%,100% { opacity:.28; transform:scale(.94); } 50% { opacity:.9; transform:scale(1.04); } }
      @keyframes blink-universal-nav-linkedin-dark { 0%,48% { opacity:1; } 49%,100% { opacity:0; } }
      @keyframes flow-universal-nav-linkedin-dark { to { stroke-dashoffset:-40; } }
      @keyframes rotate-universal-nav-linkedin-dark { to { transform:rotate(360deg); } }
      @keyframes glitch-universal-nav-linkedin-dark { 0%,92%,96%,100% { transform:translate(0); } 93% { transform:translate(2px,-1px); } 94% { transform:translate(-2px,1px); } 95% { transform:translate(1px,0); } }
      @keyframes boot-universal-nav-linkedin-dark { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }
      @media (prefers-reduced-motion: reduce) { .scan-sweep,.pulse,.blink,.flow,.radar-sweep,.glitch,.boot-1,.boot-2,.boot-3,.boot-4 { animation:none!important; opacity:1!important; transform:none!important; } .motion-ball { display:none; } }
    </style>
    
  <path d="M18,4 H342 L356,18 V102 L342,116 H18 L4,102 V18 Z" fill="#041B0D" stroke="#00FF66" stroke-width="2"/>
  <circle cx="56" cy="60" r="31" fill="none" stroke="#1D9D53" stroke-width="2"/><text x="56" y="70" text-anchor="middle" class="mono" font-size="27" font-weight="800" fill="#00FF66">in</text>
  <g class="mono"><text x="102" y="43" class="micro" fill="#7DCB98">CHANNEL // 02</text><text x="102" y="78" font-size="25" font-weight="800" letter-spacing="1" fill="#E5FFEE">LINKEDIN</text></g>
  <path d="M323 46L338 60 323 74" fill="none" stroke="#00FF66" stroke-width="3" class="pulse"/>
  <path d="M18,4 H342 L356,18 V102 L342,116 H18 L4,102 V18 Z" fill="none" stroke="#6DFFA6" stroke-width="2" stroke-dasharray="60 320" class="flow"/>
</svg>
