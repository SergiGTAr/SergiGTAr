<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title-universal-brief-light desc-universal-brief-light">
  <title id="title-universal-brief-light">SergiGTAr operator brief</title>
  <desc id="desc-universal-brief-light">Security-first software engineer: clear trust boundaries, secure defaults and reproducible evidence.</desc>
  
    <defs>
      <linearGradient id="bg-universal-brief-light" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F4F1DF"/>
        <stop offset="0.55" stop-color="#E7ECD8"/>
        <stop offset="1" stop-color="#F4F1DF"/>
      </linearGradient>
      <radialGradient id="radar-universal-brief-light" cx="50%" cy="50%" r="58%">
        <stop offset="0" stop-color="#007A3D" stop-opacity=".16"/>
        <stop offset=".55" stop-color="#007A3D" stop-opacity=".04"/>
        <stop offset="1" stop-color="#007A3D" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="sweep-universal-brief-light" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#007A3D" stop-opacity="0"/>
        <stop offset=".5" stop-color="#007A3D" stop-opacity=".25"/>
        <stop offset="1" stop-color="#007A3D" stop-opacity="0"/>
      </linearGradient>
      <pattern id="grid-universal-brief-light" width="30" height="30" patternUnits="userSpaceOnUse">
        <path d="M30 0H0V30" fill="none" stroke="#B7CDBB" stroke-width="1" opacity=".55"/>
      </pattern>
      <pattern id="scan-universal-brief-light" width="4" height="4" patternUnits="userSpaceOnUse">
        <path d="M0 3.5H4" stroke="#C3CEBE" stroke-width="1" opacity=".20"/>
      </pattern>
      <filter id="glow-universal-brief-light" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft-universal-brief-light" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.4"/>
      </filter>
    </defs>
    <style>
      .mono { font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
      text { font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 3px; }
      .micro { font-size: 12px; font-weight: 700; letter-spacing: 1.8px; }
      .body { font-size: 17px; letter-spacing: .5px; }
      .scan-sweep { animation: scan-universal-brief-light 8s linear infinite; }
      .pulse { animation: pulse-universal-brief-light 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink-universal-brief-light 1.05s steps(1) infinite; }
      .flow { stroke-dasharray: 12 8; animation: flow-universal-brief-light 2.8s linear infinite; }
      .radar-sweep { animation: rotate-universal-brief-light 5.5s linear infinite; transform-box: fill-box; transform-origin: center; }
      .glitch { animation: glitch-universal-brief-light 7s steps(1) infinite; }
      .boot-1 { animation: boot-universal-brief-light .4s .10s both; }
      .boot-2 { animation: boot-universal-brief-light .4s .35s both; }
      .boot-3 { animation: boot-universal-brief-light .4s .60s both; }
      .boot-4 { animation: boot-universal-brief-light .4s .85s both; }
      @keyframes scan-universal-brief-light { from { transform: translateY(-90px); } to { transform: translateY(690px); } }
      @keyframes pulse-universal-brief-light { 0%,100% { opacity:.28; transform:scale(.94); } 50% { opacity:.9; transform:scale(1.04); } }
      @keyframes blink-universal-brief-light { 0%,48% { opacity:1; } 49%,100% { opacity:0; } }
      @keyframes flow-universal-brief-light { to { stroke-dashoffset:-40; } }
      @keyframes rotate-universal-brief-light { to { transform:rotate(360deg); } }
      @keyframes glitch-universal-brief-light { 0%,92%,96%,100% { transform:translate(0); } 93% { transform:translate(2px,-1px); } 94% { transform:translate(-2px,1px); } 95% { transform:translate(1px,0); } }
      @keyframes boot-universal-brief-light { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }
      @media (prefers-reduced-motion: reduce) { .scan-sweep,.pulse,.blink,.flow,.radar-sweep,.glitch,.boot-1,.boot-2,.boot-3,.boot-4 { animation:none!important; opacity:1!important; transform:none!important; } .motion-ball { display:none; } }
    </style>
    
  <rect width="720" height="300" fill="url(#bg-universal-brief-light)"/><rect width="720" height="300" fill="url(#grid-universal-brief-light)" opacity=".3"/>
  <path d="M32,8 H688 L712,32 V268 L688,292 H32 L8,268 V32 Z" fill="none" stroke="#007A3D" stroke-width="3"/>
  <g class="mono">
    <text x="32" y="52" class="label" fill="#007A3D">◆ SYS://OPERATOR_BRIEF</text>
    <text x="688" y="52" text-anchor="end" class="micro" fill="#416C55">AUTH: OPERATOR</text>
    <text x="32" y="108" font-size="19" fill="#102C1E">Software engineer moving deeper into cybersecurity,</text>
    <text x="32" y="140" font-size="19" fill="#102C1E">combining a security-first mindset with product-aware</text>
    <text x="32" y="172" font-size="19" fill="#102C1E">engineering and systems that remain understandable</text>
    <text x="32" y="204" font-size="19" fill="#102C1E">under pressure.</text>
    <rect class="blink" x="189" y="186" width="10" height="18" fill="#007A3D"/>
  </g>
  <path d="M40,226 H260 L268,234 V260 L260,268 H40 L32,260 V234 Z" fill="none" stroke="#4E8B67" stroke-width="1.5"/><text x="150.0" y="252" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#007A3D">CLEAR TRUST BOUNDARIES</text><path d="M292,226 H424 L432,234 V260 L424,268 H292 L284,260 V234 Z" fill="none" stroke="#4E8B67" stroke-width="1.5"/><text x="358.0" y="252" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#007A3D">SECURE DEFAULTS</text><path d="M456,226 H650 L658,234 V260 L650,268 H456 L448,260 V234 Z" fill="none" stroke="#4E8B67" stroke-width="1.5"/><text x="553.0" y="252" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#007A3D">REPRODUCIBLE EVIDENCE</text>
  <rect class="scan-sweep" x="10" y="-40" width="700" height="80" fill="url(#sweep-universal-brief-light)" opacity=".35"/>
  <rect width="720" height="300" fill="url(#scan-universal-brief-light)" opacity=".2" pointer-events="none"/>
</svg>
