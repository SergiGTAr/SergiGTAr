<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title-universal-footer-dark desc-universal-footer-dark">
  <title id="title-universal-footer-dark">SergiGTAr public profile status</title><desc id="desc-universal-footer-dark">Public profile online: learn, build, harden, share and disclose responsibly.</desc>
  
    <defs>
      <linearGradient id="bg-universal-footer-dark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#010503"/>
        <stop offset="0.55" stop-color="#03150A"/>
        <stop offset="1" stop-color="#010503"/>
      </linearGradient>
      <radialGradient id="radar-universal-footer-dark" cx="50%" cy="50%" r="58%">
        <stop offset="0" stop-color="#00FF66" stop-opacity=".16"/>
        <stop offset=".55" stop-color="#00FF66" stop-opacity=".04"/>
        <stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="sweep-universal-footer-dark" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#00FF66" stop-opacity="0"/>
        <stop offset=".5" stop-color="#00FF66" stop-opacity=".25"/>
        <stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
      </linearGradient>
      <pattern id="grid-universal-footer-dark" width="30" height="30" patternUnits="userSpaceOnUse">
        <path d="M30 0H0V30" fill="none" stroke="#0B3F23" stroke-width="1" opacity=".55"/>
      </pattern>
      <pattern id="scan-universal-footer-dark" width="4" height="4" patternUnits="userSpaceOnUse">
        <path d="M0 3.5H4" stroke="#000000" stroke-width="1" opacity=".20"/>
      </pattern>
      <filter id="glow-universal-footer-dark" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft-universal-footer-dark" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.4"/>
      </filter>
    </defs>
    <style>
      .mono { font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 3px; }
      .micro { font-size: 12px; font-weight: 700; letter-spacing: 1.8px; }
      .body { font-size: 17px; letter-spacing: .5px; }
      .scan-sweep { animation: scan-universal-footer-dark 8s linear infinite; }
      .pulse { animation: pulse-universal-footer-dark 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink-universal-footer-dark 1.05s steps(1) infinite; }
      .flow { stroke-dasharray: 12 8; animation: flow-universal-footer-dark 2.8s linear infinite; }
      .radar-sweep { animation: rotate-universal-footer-dark 5.5s linear infinite; transform-box: fill-box; transform-origin: center; }
      .glitch { animation: glitch-universal-footer-dark 7s steps(1) infinite; }
      .boot-1 { animation: boot-universal-footer-dark .4s .10s both; }
      .boot-2 { animation: boot-universal-footer-dark .4s .35s both; }
      .boot-3 { animation: boot-universal-footer-dark .4s .60s both; }
      .boot-4 { animation: boot-universal-footer-dark .4s .85s both; }
      @keyframes scan-universal-footer-dark { from { transform: translateY(-90px); } to { transform: translateY(690px); } }
      @keyframes pulse-universal-footer-dark { 0%,100% { opacity:.28; transform:scale(.94); } 50% { opacity:.9; transform:scale(1.04); } }
      @keyframes blink-universal-footer-dark { 0%,48% { opacity:1; } 49%,100% { opacity:0; } }
      @keyframes flow-universal-footer-dark { to { stroke-dashoffset:-40; } }
      @keyframes rotate-universal-footer-dark { to { transform:rotate(360deg); } }
      @keyframes glitch-universal-footer-dark { 0%,92%,96%,100% { transform:translate(0); } 93% { transform:translate(2px,-1px); } 94% { transform:translate(-2px,1px); } 95% { transform:translate(1px,0); } }
      @keyframes boot-universal-footer-dark { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }
      @media (prefers-reduced-motion: reduce) { .scan-sweep,.pulse,.blink,.flow,.radar-sweep,.glitch,.boot-1,.boot-2,.boot-3,.boot-4 { animation:none!important; opacity:1!important; transform:none!important; } }
    </style>
    
