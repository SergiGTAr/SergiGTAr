<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title-universal-systems-light desc-universal-systems-light">
  <title id="title-universal-systems-light">SergiGTAr active system map</title>
  <desc id="desc-universal-systems-light">Responsive readout of cybersecurity focus, engineering tools and the responsible open-source protocol.</desc>
  
    <defs>
      <linearGradient id="bg-universal-systems-light" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F4F1DF"/>
        <stop offset="0.55" stop-color="#E7ECD8"/>
        <stop offset="1" stop-color="#F4F1DF"/>
      </linearGradient>
      <radialGradient id="radar-universal-systems-light" cx="50%" cy="50%" r="58%">
        <stop offset="0" stop-color="#007A3D" stop-opacity=".16"/>
        <stop offset=".55" stop-color="#007A3D" stop-opacity=".04"/>
        <stop offset="1" stop-color="#007A3D" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="sweep-universal-systems-light" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#007A3D" stop-opacity="0"/>
        <stop offset=".5" stop-color="#007A3D" stop-opacity=".25"/>
        <stop offset="1" stop-color="#007A3D" stop-opacity="0"/>
      </linearGradient>
      <pattern id="grid-universal-systems-light" width="30" height="30" patternUnits="userSpaceOnUse">
        <path d="M30 0H0V30" fill="none" stroke="#B7CDBB" stroke-width="1" opacity=".55"/>
      </pattern>
      <pattern id="scan-universal-systems-light" width="4" height="4" patternUnits="userSpaceOnUse">
        <path d="M0 3.5H4" stroke="#C3CEBE" stroke-width="1" opacity=".20"/>
      </pattern>
      <filter id="glow-universal-systems-light" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft-universal-systems-light" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.4"/>
      </filter>
    </defs>
    <style>
      .mono { font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 3px; }
      .micro { font-size: 12px; font-weight: 700; letter-spacing: 1.8px; }
      .body { font-size: 17px; letter-spacing: .5px; }
      .scan-sweep { animation: scan-universal-systems-light 8s linear infinite; }
      .pulse { animation: pulse-universal-systems-light 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink-universal-systems-light 1.05s steps(1) infinite; }
      .flow { stroke-dasharray: 12 8; animation: flow-universal-systems-light 2.8s linear infinite; }
      .radar-sweep { animation: rotate-universal-systems-light 5.5s linear infinite; transform-box: fill-box; transform-origin: center; }
      .glitch { animation: glitch-universal-systems-light 7s steps(1) infinite; }
      .boot-1 { animation: boot-universal-systems-light .4s .10s both; }
      .boot-2 { animation: boot-universal-systems-light .4s .35s both; }
      .boot-3 { animation: boot-universal-systems-light .4s .60s both; }
      .boot-4 { animation: boot-universal-systems-light .4s .85s both; }
      @keyframes scan-universal-systems-light { from { transform: translateY(-90px); } to { transform: translateY(690px); } }
      @keyframes pulse-universal-systems-light { 0%,100% { opacity:.28; transform:scale(.94); } 50% { opacity:.9; transform:scale(1.04); } }
      @keyframes blink-universal-systems-light { 0%,48% { opacity:1; } 49%,100% { opacity:0; } }
      @keyframes flow-universal-systems-light { to { stroke-dashoffset:-40; } }
      @keyframes rotate-universal-systems-light { to { transform:rotate(360deg); } }
      @keyframes glitch-universal-systems-light { 0%,92%,96%,100% { transform:translate(0); } 93% { transform:translate(2px,-1px); } 94% { transform:translate(-2px,1px); } 95% { transform:translate(1px,0); } }
      @keyframes boot-universal-systems-light { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }
      @media (prefers-reduced-motion: reduce) { .scan-sweep,.pulse,.blink,.flow,.radar-sweep,.glitch,.boot-1,.boot-2,.boot-3,.boot-4 { animation:none!important; opacity:1!important; transform:none!important; } .motion-ball { display:none; } }
    </style>
    
  <rect width="720" height="850" fill="url(#bg-universal-systems-light)"/><rect width="720" height="850" fill="url(#grid-universal-systems-light)" opacity=".3"/>
  <path d="M32,8 H688 L712,32 V818 L688,842 H32 L8,818 V32 Z" fill="none" stroke="#007A3D" stroke-width="3"/>
  <g class="mono"><text x="32" y="52" class="label" fill="#007A3D">◆ ACTIVE MODULES // SYSTEM MAP</text><text x="688" y="52" text-anchor="end" class="micro" fill="#416C55">03 ONLINE</text></g>
  <g>
    <path d="M42,76 H678 L696,94 V284 L678,302 H42 L24,284 V94 Z" fill="#EEF2E3" stroke="#4E8B67" stroke-width="1.5"/>
    <path d="M42,318 H678 L696,336 V526 L678,544 H42 L24,526 V336 Z" fill="#EEF2E3" stroke="#4E8B67" stroke-width="1.5"/>
    <path d="M42,560 H678 L696,578 V768 L678,786 H42 L24,768 V578 Z" fill="#EEF2E3" stroke="#4E8B67" stroke-width="1.5"/>
  </g>
  <g class="mono">
    <text x="50" y="116" class="label" fill="#9A6200">01 // SECURITY TRACK</text><text x="50" y="145" class="micro" fill="#416C55">CURRENT VECTOR</text>
    <g class="body" fill="#102C1E"><text x="50" y="184">◆ application security</text><text x="50" y="218">◆ secure architecture</text><text x="50" y="252">◆ privacy-aware engineering</text><text x="385" y="184">◆ defensive automation</text><text x="385" y="218">◆ threat-aware development</text><text x="385" y="252">◆ reproducible research</text></g>
    <text x="50" y="358" class="label" fill="#9A6200">02 // ENGINEERING CORE</text><text x="50" y="387" class="micro" fill="#416C55">INTEROPERABLE TOOLCHAIN</text>
    <g class="body"><text x="50" y="430" fill="#007A3D">.NET / C#</text><text x="235" y="430" fill="#102C1E">PYTHON</text><text x="420" y="430" fill="#007A3D">TYPESCRIPT</text><text x="50" y="478" fill="#102C1E">KOTLIN</text><text x="235" y="478" fill="#007A3D">SQL</text><text x="420" y="478" fill="#102C1E">DOCKER / AZURE</text></g>
    <path d="M50 448H670" stroke="#4E8B67" opacity=".5"/>
    <text x="50" y="600" class="label" fill="#9A6200">03 // OSS PROTOCOL</text><text x="50" y="629" class="micro" fill="#416C55">LEAVE A SAFE TRAIL</text>
    <g class="body"><text x="50" y="675" fill="#007A3D">01</text><text x="102" y="675" fill="#102C1E">REPRODUCE</text><text x="370" y="675" fill="#007A3D">02</text><text x="422" y="675" fill="#102C1E">SANITISE</text><text x="50" y="727" fill="#007A3D">03</text><text x="102" y="727" fill="#102C1E">DOCUMENT</text><text x="370" y="727" fill="#007A3D">04</text><text x="422" y="727" fill="#102C1E">IMPROVE</text></g>
  </g>
  <g class="mono micro"><text x="28" y="821" fill="#416C55">ASSUME LESS · EVIDENCE &gt; VIBES</text><text x="692" y="821" text-anchor="end" fill="#007A3D">SECURE BY DEFAULT</text></g>
  <rect class="scan-sweep" x="10" y="-40" width="700" height="80" fill="url(#sweep-universal-systems-light)" opacity=".35"/><rect width="720" height="850" fill="url(#scan-universal-systems-light)" opacity=".2"/>
</svg>
