  <g class="mono micro">
    <text x="34" y="375" fill="#416C55">ASSUME LESS</text>
    <text x="426" y="375" fill="#416C55">EVIDENCE &gt; VIBES</text>
    <text x="779" y="375" fill="#416C55">SECURE BY DEFAULT</text>
