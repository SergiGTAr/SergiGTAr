<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title-systems-light desc-systems-light">
  <title id="title-systems-light">SergiGTAr active security and engineering system map</title>
  <desc id="desc-systems-light">Three terminal modules showing cybersecurity focus areas, engineering tools and a reproducible open-source protocol.</desc>
  
    <defs>
      <linearGradient id="bg-systems-light" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F4F1DF"/>
        <stop offset="0.55" stop-color="#E7ECD8"/>
        <stop offset="1" stop-color="#F4F1DF"/>
      </linearGradient>
      <radialGradient id="radar-systems-light" cx="50%" cy="50%" r="58%">
        <stop offset="0" stop-color="#007A3D" stop-opacity=".16"/>
        <stop offset=".55" stop-color="#007A3D" stop-opacity=".04"/>
        <stop offset="1" stop-color="#007A3D" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="sweep-systems-light" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#007A3D" stop-opacity="0"/>
        <stop offset=".5" stop-color="#007A3D" stop-opacity=".25"/>
        <stop offset="1" stop-color="#007A3D" stop-opacity="0"/>
      </linearGradient>
      <pattern id="grid-systems-light" width="30" height="30" patternUnits="userSpaceOnUse">
        <path d="M30 0H0V30" fill="none" stroke="#B7CDBB" stroke-width="1" opacity=".55"/>
      </pattern>
      <pattern id="scan-systems-light" width="4" height="4" patternUnits="userSpaceOnUse">
        <path d="M0 3.5H4" stroke="#C3CEBE" stroke-width="1" opacity=".20"/>
      </pattern>
      <filter id="glow-systems-light" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft-systems-light" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.4"/>
      </filter>
      
    </defs>
    <style>
      .mono { font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 3px; }
      .micro { font-size: 12px; font-weight: 700; letter-spacing: 1.8px; }
      .body { font-size: 17px; letter-spacing: .5px; }
      .scan-sweep { animation: scan-systems-light 8s linear infinite; }
      .pulse { animation: pulse-systems-light 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink-systems-light 1.05s steps(1) infinite; }
      .flow { stroke-dasharray: 12 8; animation: flow-systems-light 2.8s linear infinite; }
      .radar-sweep { animation: rotate-systems-light 5.5s linear infinite; transform-box: fill-box; transform-origin: center; }
      .glitch { animation: glitch-systems-light 7s steps(1) infinite; }
      .boot-1 { animation: boot-systems-light .4s .10s both; }
      .boot-2 { animation: boot-systems-light .4s .35s both; }
      .boot-3 { animation: boot-systems-light .4s .60s both; }
      .boot-4 { animation: boot-systems-light .4s .85s both; }
      @keyframes scan-systems-light { from { transform: translateY(-90px); } to { transform: translateY(690px); } }
      @keyframes pulse-systems-light { 0%,100% { opacity:.28; transform:scale(.94); } 50% { opacity:.9; transform:scale(1.04); } }
      @keyframes blink-systems-light { 0%,48% { opacity:1; } 49%,100% { opacity:0; } }
      @keyframes flow-systems-light { to { stroke-dashoffset:-40; } }
      @keyframes rotate-systems-light { to { transform:rotate(360deg); } }
      @keyframes glitch-systems-light { 0%,92%,96%,100% { transform:translate(0); } 93% { transform:translate(2px,-1px); } 94% { transform:translate(-2px,1px); } 95% { transform:translate(1px,0); } }
      @keyframes boot-systems-light { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }
      @media (prefers-reduced-motion: reduce) { .scan-sweep,.pulse,.blink,.flow,.radar-sweep,.glitch,.boot-1,.boot-2,.boot-3,.boot-4 { animation:none!important; opacity:1!important; transform:none!important; } }
    </style>
    
  <rect width="1200" height="400" fill="url(#bg-systems-light)"/>
  <rect width="1200" height="400" fill="url(#grid-systems-light)" opacity=".34"/>
  <g><circle cx="971" cy="272" r="0.45" fill="#007A3D" opacity="0.26"/><circle cx="634" cy="78" r="0.55" fill="#007A3D" opacity="0.11"/><circle cx="810" cy="36" r="0.55" fill="#007A3D" opacity="0.10"/><circle cx="92" cy="109" r="0.45" fill="#007A3D" opacity="0.10"/><circle cx="65" cy="290" r="0.9" fill="#007A3D" opacity="0.19"/><circle cx="246" cy="334" r="0.9" fill="#007A3D" opacity="0.19"/><circle cx="250" cy="312" r="0.7" fill="#007A3D" opacity="0.25"/><circle cx="118" cy="325" r="0.55" fill="#007A3D" opacity="0.24"/><circle cx="1188" cy="270" r="0.7" fill="#007A3D" opacity="0.22"/><circle cx="209" cy="387" r="0.7" fill="#007A3D" opacity="0.11"/><circle cx="298" cy="148" r="0.7" fill="#007A3D" opacity="0.28"/><circle cx="1013" cy="237" r="0.7" fill="#007A3D" opacity="0.26"/><circle cx="530" cy="86" r="0.9" fill="#007A3D" opacity="0.12"/><circle cx="499" cy="231" r="0.9" fill="#007A3D" opacity="0.16"/><circle cx="937" cy="56" r="0.9" fill="#007A3D" opacity="0.29"/><circle cx="163" cy="329" r="0.55" fill="#007A3D" opacity="0.16"/><circle cx="867" cy="118" r="0.9" fill="#007A3D" opacity="0.20"/><circle cx="842" cy="259" r="0.9" fill="#007A3D" opacity="0.30"/><circle cx="11" cy="87" r="0.45" fill="#007A3D" opacity="0.20"/><circle cx="932" cy="243" r="0.55" fill="#007A3D" opacity="0.22"/><circle cx="610" cy="399" r="0.45" fill="#007A3D" opacity="0.23"/><circle cx="846" cy="322" r="0.7" fill="#007A3D" opacity="0.21"/><circle cx="541" cy="56" r="0.55" fill="#007A3D" opacity="0.09"/><circle cx="321" cy="156" r="0.45" fill="#007A3D" opacity="0.18"/><circle cx="922" cy="287" r="0.7" fill="#007A3D" opacity="0.29"/><circle cx="286" cy="327" r="0.9" fill="#007A3D" opacity="0.24"/><circle cx="59" cy="188" r="0.45" fill="#007A3D" opacity="0.21"/><circle cx="711" cy="8" r="0.7" fill="#007A3D" opacity="0.10"/><circle cx="725" cy="200" r="0.9" fill="#007A3D" opacity="0.19"/><circle cx="0" cy="349" r="0.45" fill="#007A3D" opacity="0.24"/><circle cx="1016" cy="125" r="0.55" fill="#007A3D" opacity="0.20"/><circle cx="1096" cy="87" r="0.7" fill="#007A3D" opacity="0.23"/><circle cx="398" cy="225" r="0.7" fill="#007A3D" opacity="0.10"/><circle cx="917" cy="185" r="0.45" fill="#007A3D" opacity="0.28"/><circle cx="284" cy="263" r="0.55" fill="#007A3D" opacity="0.13"/><circle cx="24" cy="217" r="0.7" fill="#007A3D" opacity="0.11"/><circle cx="507" cy="225" r="0.55" fill="#007A3D" opacity="0.15"/><circle cx="436" cy="262" r="0.45" fill="#007A3D" opacity="0.24"/><circle cx="65" cy="21" r="0.55" fill="#007A3D" opacity="0.28"/><circle cx="234" cy="9" r="0.55" fill="#007A3D" opacity="0.10"/><circle cx="1007" cy="61" r="0.7" fill="#007A3D" opacity="0.26"/><circle cx="997" cy="96" r="0.7" fill="#007A3D" opacity="0.10"/><circle cx="630" cy="124" r="0.55" fill="#007A3D" opacity="0.25"/><circle cx="294" cy="26" r="0.9" fill="#007A3D" opacity="0.11"/><circle cx="767" cy="344" r="0.9" fill="#007A3D" opacity="0.27"/><circle cx="416" cy="215" r="0.9" fill="#007A3D" opacity="0.28"/><circle cx="128" cy="80" r="0.45" fill="#007A3D" opacity="0.25"/><circle cx="698" cy="219" r="0.55" fill="#007A3D" opacity="0.10"/><circle cx="1072" cy="82" r="0.7" fill="#007A3D" opacity="0.28"/><circle cx="45" cy="55" r="0.9" fill="#007A3D" opacity="0.09"/><circle cx="1195" cy="56" r="0.45" fill="#007A3D" opacity="0.19"/><circle cx="54" cy="33" r="0.7" fill="#007A3D" opacity="0.28"/></g>
  <path d="M34,8 H1166 L1192,34 V366 L1166,392 H34 L8,366 V34 Z" fill="none" stroke="#007A3D" stroke-width="2"/>
  <g class="mono">
    <text x="36" y="54" class="label" fill="#007A3D">◆ ACTIVE MODULES // SYSTEM MAP</text>
    <text x="1164" y="54" text-anchor="end" class="micro" fill="#416C55">3 MODULES ONLINE · READ-ONLY PUBLIC OUTPUT</text>
  </g>
  <path d="M48,86 H364 L382,104 V328 L364,346 H48 L30,328 V104 Z" fill="#EEF2E3" fill-opacity=".88" stroke="#4E8B67" stroke-width="1.5"/><path d="M442,86 H758 L776,104 V328 L758,346 H442 L424,328 V104 Z" fill="#EEF2E3" fill-opacity=".88" stroke="#4E8B67" stroke-width="1.5"/><path d="M836,86 H1152 L1170,104 V328 L1152,346 H836 L818,328 V104 Z" fill="#EEF2E3" fill-opacity=".88" stroke="#4E8B67" stroke-width="1.5"/>
  <g class="mono">
    <text x="55" y="120" class="label" fill="#9A6200">01 // SECURITY TRACK</text>
    <text x="55" y="153" class="micro" fill="#416C55">CURRENT VECTOR</text>
    <g class="body" fill="#102C1E">
      <text x="55" y="190">◆ application security</text>
      <text x="55" y="224">◆ secure architecture</text>
      <text x="55" y="258">◆ privacy-aware engineering</text>
      <text x="55" y="292">◆ defensive automation</text>
      <text x="55" y="326">◆ reproducible research</text>
    </g>

    <text x="449" y="120" class="label" fill="#9A6200">02 // ENGINEERING CORE</text>
    <text x="449" y="153" class="micro" fill="#416C55">INTEROPERABLE TOOLCHAIN</text>
    <g class="body">
      <text x="449" y="194" fill="#007A3D">.NET / C#</text><text x="615" y="194" fill="#102C1E">PYTHON</text>
      <text x="449" y="236" fill="#102C1E">TYPESCRIPT</text><text x="615" y="236" fill="#007A3D">KOTLIN</text>
      <text x="449" y="278" fill="#007A3D">SQL</text><text x="615" y="278" fill="#102C1E">DOCKER</text>
      <text x="449" y="320" fill="#102C1E">AZURE</text><text x="615" y="320" fill="#007A3D">OWASP</text>
    </g>
    <g stroke="#4E8B67" opacity=".65"><path d="M449 207H738M449 249H738M449 291H738"/></g>

    <text x="843" y="120" class="label" fill="#9A6200">03 // OSS PROTOCOL</text>
    <text x="843" y="153" class="micro" fill="#416C55">LEAVE A SAFE TRAIL</text>
    <g class="body">
      <text x="843" y="194" fill="#007A3D">01</text><text x="890" y="194" fill="#102C1E">REPRODUCE</text>
      <text x="843" y="236" fill="#007A3D">02</text><text x="890" y="236" fill="#102C1E">SANITISE</text>
      <text x="843" y="278" fill="#007A3D">03</text><text x="890" y="278" fill="#102C1E">DOCUMENT</text>
      <text x="843" y="320" fill="#007A3D">04</text><text x="890" y="320" fill="#102C1E">IMPROVE</text>
