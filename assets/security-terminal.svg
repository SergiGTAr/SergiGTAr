<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">SergiGTAr security terminal</title>
  <desc id="description">A dark CRT-inspired terminal banner reading Security-First Software Engineering.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020403"/>
      <stop offset="0.52" stop-color="#07110d"/>
      <stop offset="1" stop-color="#020706"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="0.38" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#32ff84" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#32ff84" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#d9ffe8" opacity="0.035"/>
    </pattern>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#40ff91" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="neon" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .micro { font-size: 15px; letter-spacing: 2.6px; }
      .hero { font-size: 57px; font-weight: 700; letter-spacing: 4px; }
      .subhero { font-size: 30px; font-weight: 700; letter-spacing: 7px; }
      .prompt { font-size: 20px; letter-spacing: 0.8px; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="16.5" fill="none" stroke="#3cff8b" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="14" y="14" width="1172" height="272" rx="10" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#screenGlow)"/>

  <g class="mono">
    <text x="48" y="45" class="micro" fill="#73ffa7">◆ SERGIGTAR OS // SECURITY CONSOLE // PUBLIC NODE</text>
    <text x="1152" y="45" class="micro" fill="#73ffa7" text-anchor="end">AUG.2026</text>

    <text x="48" y="126" class="hero" fill="#d8ffe6" filter="url(#neon)">SECURITY-FIRST</text>
    <text x="51" y="178" class="subhero" fill="#54ff93">SOFTWARE ENGINEERING</text>

    <text x="50" y="238" class="prompt" fill="#a2ffbf">sergigtar@console:~$ build --harden --verify</text>
    <rect x="549" y="218" width="12" height="24" rx="1" fill="#54ff93">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(914 82)">
      <path d="M78 0 156 45 156 135 78 180 0 135 0 45Z" fill="#06130d" stroke="#54ff93" stroke-width="2" stroke-opacity="0.78"/>
      <path d="M78 23 136 56 136 124 78 157 20 124 20 56Z" fill="none" stroke="#54ff93" stroke-width="1" stroke-opacity="0.33"/>
      <path d="M78 47 115 68 115 112 78 133 41 112 41 68Z" fill="#54ff93" fill-opacity="0.08" stroke="#d8ffe6" stroke-width="1.5"/>
      <text x="78" y="86" class="micro" fill="#d8ffe6" text-anchor="middle">ACCESS</text>
      <text x="78" y="108" class="micro" fill="#54ff93" text-anchor="middle">GRANTED</text>
      <circle cx="78" cy="147" r="3" fill="#54ff93" filter="url(#neon)"/>
    </g>
  </g>

  <rect width="1200" height="300" rx="18" fill="url(#scanlines)" pointer-events="none"/>
</svg>
